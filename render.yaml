services:
  - type: web
    name: integration-api
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      cd client && npm install --include=dev && npm run build &&
      cd ../server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: MESSENGER_PAGE
        value: https://www.facebook.com/profile.php?id=61594204353841
      - key: BREVO_NEWSLETTER_LIST_ID
        value: 6
      - key: CLIENT_URL
        value: https://integration-06n2.onrender.com
      - key: NODE_ENV
        value: production
